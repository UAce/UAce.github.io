- name: WebsiteWatcher
  description: |
    WebsiteWatcher is a Python Command line tool that watches a website and notifies
    the user via email or sms when the watcher condition is met. It's useful for tracking
    lists or values on the internet, e.g. New items, Price changes, etc.

    <br><br> <b>Built with</b>: Python3, Selenium WebDriver, Beautiful Soup 4, Twilio Email/SMS API, Tox
    <br> <b><a class="" href="https://github.com/UAce/WebsiteWatcher" target="_blank">View Project on GitHub</a></b>
  images:

- name: YoutubeStopwatch
  description: |
    A chrome extension that is used to help users plan, monitor, control their YouTube usage.
    Essentially, it prompts the user for an estimated time they want to spend on Youtube and sends a 
    notification when the time is up. The user can choose to leave or continue watching videos but there 
    will be a gradual blur applied to all videos. This was done as part of a school project (Human-Computer Interaction). <br>
    The chrome extension is available here:<span class="add-margin-top-small add-margin-bottom-small" style="display: inline-block;">
    <a class="chrome-ext-btn"
        href="https://chrome.google.com/webstore/detail/youtubestopwatch/ibaejmohdpnppkglomilmholhndaobag"
        target="_blank">Download Extension</a>
    </span><br>
     <br><b>Built with</b>: HTML5, CSS3, Javascript, JQuery, Chrome APIs, Chart.js
     <br> <b><a class="" href="https://github.com/UAce/YouTubeStopwatch" target="_blank">View Project on GitHub</a></b>
  images:
    - path: assets/images/demo/ytsw_modal.png
      alt: Time Modal
    - path: assets/images/demo/ytsw_settings.png
      alt: Settings Page

- name: MobSlayer
  description: |
    Native android mobile game where the player's only task is to eliminate monsters (shamelessly stolen) from MapleStory. 
    As they level up, players will acquire new skills, unlock new maps and encounter new monsters. If the player is lucky,
    they will encounter a boss. This was initially made as a joke but it turned out to be quite fun and a good experience.
    <br><br> <b>Built with</b>: Android Studio, Java, GSON
    <br> <b><a class="" href="https://github.com/UAce/MobSlayer" target="_blank">View Project on GitHub</a></b>
  images:
    - path: assets/images/demo/menu.png
      alt: Game Menu
    - path: assets/images/demo/sharp_eyes.png
      alt: Sharp Eyes Skill
    - path: assets/images/demo/levelup.png
      alt: Level up
    - path: assets/images/demo/slime_dmg.png
      alt: Attack Monster
